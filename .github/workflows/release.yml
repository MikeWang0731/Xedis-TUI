name: Build release binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本号，例如 v0.2.0；仅发布时必填"
        required: false
        type: string
      publish_release:
        description: "构建完成后创建 GitHub Release"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: xedis-tui

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select stable Rust
        run: rustup update stable && rustup default stable

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: xedis-tui-windows-x86_64.zip
          - platform: macOS x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: xedis-tui-macos-x86_64.tar.gz
          - platform: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            asset: xedis-tui-macos-aarch64.tar.gz
          - platform: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: xedis-tui-linux-x86_64.tar.gz
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: xedis-tui-linux-aarch64.tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Select stable Rust and install target
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/$env:BINARY_NAME.exe" "dist/$env:BINARY_NAME.exe"
          Compress-Archive -Path "dist/$env:BINARY_NAME.exe" -DestinationPath "${{ matrix.asset }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$BINARY_NAME" "dist/$BINARY_NAME"
          chmod +x "dist/$BINARY_NAME"
          tar -C dist -czf "${{ matrix.asset }}" "$BINARY_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.asset }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式不正确：$RELEASE_TAG；请使用 v0.2.0 或 v0.2.0-beta.1"
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Xedis-TUI $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
